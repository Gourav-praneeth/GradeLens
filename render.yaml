services:
  - type: web
    name: gradelens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_BUCKET
        value: uploads
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: LLM_KEY_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FEEDBACK_ADMIN_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
